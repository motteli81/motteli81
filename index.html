<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ハムの大冒険</title>
    <!-- 🎯 CSSの強制読み込みパラメータ付与 -->
    <link rel="stylesheet" href="style.css?v=1.2">
</head>
<body>

  <h1 id="titleText">🐹 ハムの大冒険</h1>

  <!-- 2D用ステージ選択ボタン -->
  <div class="stage-select-bar" id="stageSelectBar">
    <button class="select-btn active" id="btnSelect1" onclick="switchStage(1)">1-1 地上</button>
    <button class="select-btn" id="btnSelect2" onclick="switchStage(2)">1-2 海中</button>
    <button class="select-btn" id="btnSelect3" onclick="switchStage(3)">1-3 宇宙</button>
    <button class="select-btn" id="btnSelect4" onclick="switchStage(4)">2-1 暗躍</button>
  </div>

  <div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="480"></canvas>
  </div>

  <!-- 2D用操作UI -->
  <div class="controls" id="controls-2d">
    <button class="sound-btn" id="btnSound">🎵 サウンド ON / OFF (タップしてスタート)</button>
    <div class="btn-row">
      <div class="dpad-container" id="dpadContainer">
        <div class="btn btn-left" id="btnLeft">←</div>
        <div class="btn btn-right" id="btnRight">→</div>
      </div>
      <div class="joystick-container" id="joystickArea">
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
      <div>
        <div class="btn btn-action btn-shot" id="btnShot">SHOT</div>
        <div class="btn btn-action btn-jump" id="btnJump">JUMP</div>
      </div>
    </div>
  </div>

  <!-- 3D用操作UI -->
  <div id="controls-3d">
    <div class="btn-group-3d">
      <div class="row-3d">
        <div class="btn-3d" style="width:100%" id="btn-up">照準 ▲</div>
      </div>
      <div class="row-3d">
        <div class="btn-3d btn-turn" style="width:50%" id="btn-3d-left">◀ 旋回</div>
        <div class="btn-3d btn-turn" style="width:50%" id="btn-3d-right">旋回 ▶</div>
      </div>
      <div class="row-3d">
        <div class="btn-3d" style="width:100%" id="btn-down">照準 ▼</div>
      </div>
    </div>

    <div class="btn-group-3d">
      <div class="btn-3d btn-fire" id="btn-fire">🌻 SEED</div>
    </div>
  </div>
  <div class="touch-hint-3d" id="touch-hint-3d">※画面タップでひまわりの種を投げて追い払おう！</div>

  <!-- 🎯 JavaScriptの強制読み込みパラメータ付与（末尾に一度だけ配置） -->
  <script src="action2d.js?v=1.1"></script>
  <script src="shooting3d.js?v=1.1"></script>
</body>
</html>
